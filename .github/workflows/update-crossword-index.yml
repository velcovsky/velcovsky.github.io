name: Update crossword index

on:
  push:
    branches: [main]
    paths:
      - 'kriz/krizovky/**/*.json'
      - 'kriz/krizovky/*.json'
      - '.github/workflows/update-crossword-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate index.json ordered by original add date
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          folder = Path('kriz/krizovky')
          entries = []
          for file in folder.rglob('*.json'):
              if file.name.lower() == 'index.json':
                  continue
              rel = file.relative_to(folder).as_posix()
              # The oldest commit that added this file gives its original addition date.
              result = subprocess.run(
                  ['git', 'log', '--follow', '--diff-filter=A', '--format=%ct', '--', str(file)],
                  capture_output=True, text=True, check=True
              )
              dates = [line.strip() for line in result.stdout.splitlines() if line.strip().isdigit()]
              added = int(dates[-1]) if dates else int(file.stat().st_mtime)
              entries.append({
                  'name': file.name,
                  'path': rel,
                  'added': added,
                  'url': f'https://raw.githubusercontent.com/velcovsky/velcovsky.github.io/main/kriz/krizovky/{rel}'
              })
          entries.sort(key=lambda x: (-x['added'], x['name'].casefold()))
          (folder / 'index.json').write_text(
              json.dumps(entries, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(f'Generated index with {len(entries)} crossword(s), newest first.')
          PY

      - name: Commit updated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kriz/krizovky/index.json
          if git diff --cached --quiet; then
            echo 'Index is already up to date.'
          else
            git commit -m 'Update crossword index'
            git push
          fi
